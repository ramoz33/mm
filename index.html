<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Maria Clara — Céu de Tulipas ✨🌷</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #090019;
    touch-action: manipulation;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #title {
    position: fixed;
    top: 22px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #ffd5ea;
    font: 500 14px Arial, sans-serif;
    letter-spacing: 3px;
    opacity: .72;
    pointer-events: none;
    text-shadow: 0 0 12px rgba(255,130,190,.55);
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="title">TOQUE NA TELA ✨</div>

<script>
(() => {
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  let W = 0, H = 0, DPR = 1;
  let stars = [], particles = [], swirls = [];
  let targets = [];
  const text = "MARIA CLARA";

  let phase = "scatter";
  let phaseTime = 0;
  let lastTime = 0;

  const rand = (a,b) => a + Math.random() * (b-a);

  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth;
    H = innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    createStars();
    createSwirls();
    makeTextTargets();
  }

  // Céu profundo com pinceladas curvas, inspirado em uma noite estrelada.
  function createSwirls() {
    swirls = [];
    const count = Math.max(28, Math.floor(W / 16));
    for (let i = 0; i < count; i++) {
      swirls.push({
        angle: rand(0, Math.PI * 2),
        radius: rand(Math.min(W,H)*.08, Math.max(W,H)*.62),
        speed: rand(.00010,.00028) * (Math.random() < .5 ? -1 : 1),
        width: rand(14,42),
        alpha: rand(.025,.075),
        wave: rand(12,42),
        phase: rand(0,Math.PI*2)
      });
    }
  }

  function createStars() {
    stars = [];
    const count = Math.max(330, Math.min(720, Math.floor(W*H/2050)));

    for (let i=0; i<count; i++) {
      stars.push({
        x: rand(0,W),
        y: rand(0,H),
        tx: W/2,
        ty: H*.48,
        vx: rand(-.11,.11),
        vy: rand(.015,.22),
        size: rand(.45,1.65),
        phase: rand(0,Math.PI*2),
        alpha: rand(.45,1),
        pink: Math.random() < .28
      });
    }
  }

  function makeTextTargets() {
    const off = document.createElement("canvas");
    const octx = off.getContext("2d");

    // Um pouco menor no celular para não cortar as laterais.
    const fontSize = Math.min(W * .135, 82);
    off.width = Math.ceil(W * .96);
    off.height = Math.ceil(fontSize * 1.5);

    octx.clearRect(0,0,off.width,off.height);
    octx.font = `900 ${fontSize}px Arial Black, Arial, sans-serif`;
    octx.textAlign = "center";
    octx.textBaseline = "middle";
    octx.fillStyle = "#fff";
    octx.fillText(text, off.width/2, off.height/2);

    const data = octx.getImageData(0,0,off.width,off.height).data;
    targets = [];

    // Espaçamento menor = letras mais definidas, sem virar uma mancha.
    const step = Math.max(2.7, Math.floor(fontSize/20));

    for (let y=0; y<off.height; y+=step) {
      for (let x=0; x<off.width; x+=step) {
        const a = data[(y*off.width+x)*4+3];
        if (a > 100) {
          targets.push({
            x: W*.5 + (x-off.width*.5),
            y: H*.47 + y-off.height*.5
          });
        }
      }
    }

    stars.forEach((s,i) => {
      const t = targets[i % targets.length];
      s.tx=t.x; s.ty=t.y;
    });
  }

  function burst(x,y) {
    for (let i=0;i<75;i++) {
      const a=rand(0,Math.PI*2);
      const speed=rand(1.2,5.5);
      particles.push({
        x,y,
        vx:Math.cos(a)*speed,
        vy:Math.sin(a)*speed,
        life:1,
        size:rand(.8,2.5),
        pink:Math.random()<.75
      });
    }
  }

  canvas.addEventListener("pointerdown", e => {
    burst(e.clientX,e.clientY);
    stars.forEach(s=>{
      const dx=s.x-e.clientX, dy=s.y-e.clientY;
      const d=Math.hypot(dx,dy);
      if(d<190 && d>1){
        const f=(190-d)/190;
        s.x += dx/d*f*42;
        s.y += dy/d*f*42;
      }
    });
  });

  function update(dt,time) {
    phaseTime += dt;

    if (phase==="scatter") {
      stars.forEach(s=>{
        s.x += s.vx*dt;
        s.y += s.vy*dt;
        if(s.y>H+4) s.y=-4;
        if(s.x<-4) s.x=W+4;
        if(s.x>W+4) s.x=-4;
      });
      if(phaseTime>1700){ phase="forming"; phaseTime=0; }
    }

    if(phase==="forming"){
      const p=Math.min(1,phaseTime/2600);
      const ease=1-Math.pow(1-p,3);
      stars.forEach(s=>{
        s.x += (s.tx-s.x)*(.025+.025*ease);
        s.y += (s.ty-s.y)*(.025+.025*ease);
      });
      if(phaseTime>3400){ phase="hold"; phaseTime=0; }
    }

    if(phase==="hold"){
      stars.forEach(s=>{
        s.x += (s.tx-s.x)*.012;
        s.y += (s.ty-s.y)*.012;
      });
      if(phaseTime>3400){ phase="explode"; phaseTime=0; }
    }

    if(phase==="explode"){
      stars.forEach(s=>{
        const dx=s.x-W/2, dy=s.y-H*.47;
        const d=Math.hypot(dx,dy)||1;
        s.x += dx/d*dt*.095;
        s.y += dy/d*dt*.095;
      });
      if(phaseTime>1800){
        phase="scatter"; phaseTime=0; makeTextTargets();
      }
    }

    particles.forEach(p=>{
      p.x += p.vx*dt*.06;
      p.y += p.vy*dt*.06;
      p.vx *= .985; p.vy *= .985;
      p.life -= dt*.00125;
    });
    particles=particles.filter(p=>p.life>0);
  }

  function drawSky(time){
    // Fundo em camadas, com azul/noite + violeta + rosa tulipa.
    ctx.fillStyle="rgba(7,1,23,.28)";
    ctx.fillRect(0,0,W,H);

    const g=ctx.createRadialGradient(W*.5,H*.45,0,W*.5,H*.45,Math.max(W,H)*.78);
    g.addColorStop(0,"rgba(78,26,116,.22)");
    g.addColorStop(.38,"rgba(48,12,92,.16)");
    g.addColorStop(.72,"rgba(22,5,55,.12)");
    g.addColorStop(1,"rgba(2,0,12,0)");
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);

    // Pinceladas espirais suaves.
    ctx.save();
    ctx.globalCompositeOperation="screen";
    for(const s of swirls){
      const a=s.angle+s.speed*time;
      const cx=W*.5+Math.cos(a)*s.radius;
      const cy=H*.47+Math.sin(a)*s.radius*.56;
      const bend=Math.sin(time*.001+s.phase)*s.wave;

      ctx.globalAlpha=s.alpha;
      ctx.lineWidth=s.width;
      ctx.lineCap="round";
      ctx.strokeStyle=Math.random()>.22 ? "#5d398f" : "#b13f82";

      ctx.beginPath();
      ctx.arc(cx+bend,cy,Math.abs(s.radius)*.22, a, a+1.15);
      ctx.stroke();
    }
    ctx.restore();

    // Pequenas pinceladas de rosa, como pétalas luminosas no céu.
    ctx.save();
    ctx.globalCompositeOperation="screen";
    for(let i=0;i<18;i++){
      const a=time*.00018*(i%2?1:-1)+i*2.1;
      const x=W*.5+Math.cos(a)*W*(.15+i*.025);
      const y=H*.46+Math.sin(a*1.13)*H*.22;
      ctx.globalAlpha=.035;
      ctx.strokeStyle="#ff78b7";
      ctx.lineWidth=rand(5,13);
      ctx.beginPath();
      ctx.arc(x,y,25+i*4,a,a+.55);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawStars(time){
    const forming=phase==="forming" || phase==="hold";
    const pulse=.5+.5*Math.sin(time*.0032);

    for(const s of stars){
      const b=.5+.5*Math.sin(time*.0027+s.phase);

      if(forming){
        // Halo pequeno e controlado: mantém MARIA CLARA legível.
        ctx.globalAlpha=.22+b*.10;
        ctx.shadowBlur=4+b*3;
        ctx.shadowColor=s.pink ? "#ff79bd" : "#b9a7ff";
        ctx.fillStyle=s.pink ? "#ffb8dc" : "#e8e5ff";
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.size*1.9,0,Math.PI*2);
        ctx.fill();

        // Núcleo branco nítido.
        ctx.globalAlpha=s.alpha*(.82+b*.18);
        ctx.shadowBlur=2;
        ctx.shadowColor=s.pink ? "#ff6faf" : "#d9d2ff";
        ctx.fillStyle="#fffaff";
        ctx.beginPath();
        ctx.arc(s.x,s.y,Math.max(.65,s.size*.72),0,Math.PI*2);
        ctx.fill();
      } else {
        ctx.globalAlpha=s.alpha*(.62+b*.38);
        ctx.shadowBlur=5+b*5;
        ctx.shadowColor=s.pink ? "#ff66ae" : "#9d8cff";
        ctx.fillStyle=s.pink ? "#ffc1e1" : "#eeeaff";
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
        ctx.fill();
      }
    }

    // Alguns brilhos em forma de cruz, bem discretos.
    if(phase==="hold"){
      for(let i=0;i<12;i++){
        const s=stars[(i*37)%stars.length];
        const q=.4+.35*Math.sin(time*.004+i);
        ctx.globalAlpha=q;
        ctx.strokeStyle=i%3===0 ? "#ffacd3" : "#e4ddff";
        ctx.shadowBlur=7;
        ctx.shadowColor="#ff79b8";
        ctx.lineWidth=.8;
        ctx.beginPath();
        ctx.moveTo(s.x-4,s.y); ctx.lineTo(s.x+4,s.y);
        ctx.moveTo(s.x,s.y-4); ctx.lineTo(s.x,s.y+4);
        ctx.stroke();
      }
    }
  }

  function drawParticles(){
    for(const p of particles){
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.shadowBlur=8;
      ctx.shadowColor=p.pink ? "#ff6fb3" : "#a99cff";
      ctx.fillStyle=p.pink ? "#ffd1e7" : "#e7e0ff";
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      ctx.fill();
    }
  }

  function drawTulipGlow(time){
    // Uma pequena "flor" abstrata no centro durante a explosão.
    if(phase!=="explode") return;
    const p=Math.min(1,phaseTime/900);
    const a=(1-p)*.75;
    const x=W/2, y=H*.47;

    ctx.save();
    ctx.globalAlpha=a;
    ctx.translate(x,y);
    ctx.scale(1+Math.sin(time*.004)*.04,1+Math.sin(time*.004)*.04);
    ctx.shadowBlur=25;
    ctx.shadowColor="#ff69ad";
    ctx.fillStyle="#ff8cbd";

    ctx.beginPath();
    ctx.moveTo(0,10);
    ctx.bezierCurveTo(-38,-20,-34,-50,-14,-42);
    ctx.bezierCurveTo(-5,-62,5,-62,14,-42);
    ctx.bezierCurveTo(34,-50,38,-20,0,10);
    ctx.fill();

    ctx.globalAlpha=a*.75;
    ctx.strokeStyle="#ffc1dd";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(0,10); ctx.lineTo(0,48);
    ctx.stroke();
    ctx.restore();
  }

  function draw(time){
    drawSky(time);
    drawStars(time);
    drawParticles();
    drawTulipGlow(time);

    ctx.globalAlpha=1;
    ctx.shadowBlur=0;
  }

  function loop(time){
    const dt=Math.min(40,time-lastTime||16);
    lastTime=time;
    update(dt,time);
    draw(time);
    requestAnimationFrame(loop);
  }

  resize();
  addEventListener("resize",resize,{passive:true});
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
